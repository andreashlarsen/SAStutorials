# Part IV, Step 3: refine the linker and the hexamer in alternating phases.
#
# This is the solution to the Step 3 exercise. The parameter_generator takes
# effect wherever it appears, including inside a loop, so alternating two of
# them alternates which kind of move is proposed:
#   phase 1 -- translate/rotate move the two fragments of the chain (the linker)
#   phase 2 -- sym_translate/sym_rotate move the D3 symmetry (the hexamer)
#
# The inner loop is named "refine" and reused for phase 2 with "loop copy refine",
# which needs no "end" of its own.
#
# Each phase also sets its own "select", since the two move types need different
# ones -- see the comment on phase 2 below.
#
# 2 x (30 + 30) = 120 iterations. Expect chi2/dof to drop from ~16 to ~4-5.
# Most accepts land in the first phase 1; phase 2 often accepts nothing, since
# the decomposed D3 geometry is already close to optimal at these amplitudes.

output output/paaz_step3_twophase/
load {
	pdb Datafiles/SASDGL2.pdb
	saxs Datafiles/SASDGL2.dat
	split chain
}
convert_to_symmetry d3
split b1 518
autoconstrain backbone

save initial_state.pdb
save trajectory.xyz

print "Initial chi2: {chi2_no_penalty}"
loop 2
	# phase 1: optimize the flexible linker, keeping the hexamer fixed
	print {
		msg "Phase 1: optimizing the flexible linker"
		color blue
	}
	parameter_generator {
		iterations 30
		translate 0.1
		rotate 0.1
	}
	select random_constraint
	loop refine
		optimize_once
			on_improvement
				print {
					msg "{iteration}/{iterations_total}: Accepted with new chi2 {chi2_no_penalty}"
					colour green
				}
				update structure
				save trajectory.xyz
			end
		end
	end

	# phase 2: optimize the hexamer, keeping the flexible linker fixed
	print {
		msg "Phase 2: optimizing the hexamer"
		color blue
	}
	parameter_generator {
		iterations 30
		sym_translate 0.1
		sym_rotate 0.1
	}
	# a shared symmetry must be selected with random_symmetry: a body selection
	# can land on a non-owning view of it, where the new parameters are discarded
	select random_symmetry
	loop copy refine
end
save final_state.pdb
