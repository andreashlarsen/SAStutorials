output output/rigidbody_lar/
load {
	pdb Datafiles/LAR1-4.pdb
	saxs Datafiles/LAR1-4.dat
	split 7 99 199 292
}
autoconstrain backbone

save initial_state.pdb
save trajectory.xyz
parameter_generator {
	iterations 200
	translate 1
	rotate 0.2
}
select random_constraint
transform rigid_transform

print "Initial chi2: {chi2_no_penalty}"
loop
	optimize_once
		on_improvement
			print {
				msg "{iteration}/{iterations_total}: Accepted with new chi2 {chi2_no_penalty}"
				colour green
			}
			update structure
			save trajectory.xyz
		end
	end
end
save final_state.pdb
