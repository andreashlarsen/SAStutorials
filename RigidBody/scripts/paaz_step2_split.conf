# Part IV, Step 2: split the body that already carries the D3 symmetry.
#
# Each chain is a large N-terminal ALDH domain and a smaller C-terminal ECH
# domain joined by a flexible linker. The boundary sits at residue 518 --
# in the GUI this is the "Additional splits (an existing body)" field, since
# the main "Split at residues" was already used for the chain split.
#
# autoconstrain backbone then gives exactly one constraint, as the tutorial says.
# This script is setup only; run it to check the numbers before refining.

output output/paaz_step2/
load {
	pdb Datafiles/SASDGL2.pdb
	saxs Datafiles/SASDGL2.dat
	split chain
}
convert_to_symmetry d3
split b1 518
autoconstrain backbone

save initial_state.pdb
