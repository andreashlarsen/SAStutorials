# Part IV, Step 1: recover the D3 symmetry already present in the hexamer.
#
# Splitting by chain gives b1..b6; decomposing them into d3 collapses five of
# them into a symmetry that regenerates the rest from b1.
# Expect: "Fitted d3 to 6 copies (residual RMSD 0.767 A)" and chi2/dof ~= 20.
#
# Try swapping d3 for c6 to see the decomposition rejected; p2-c3 is the
# composite that also works (see the tutorial's Step 1 solution).

output output/paaz_step1/
load {
	pdb Datafiles/SASDGL2.pdb
	saxs Datafiles/SASDGL2.dat
	split chain
}
convert_to_symmetry d3

save initial_state.pdb
