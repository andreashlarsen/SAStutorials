# Part IV, Step 3 exercise: the single-phase alternative, for comparison.
#
# Same setup and the same total budget as paaz_step3_twophase.conf, but with
# all four amplitudes in one generator running the full 120 iterations, so
# linker moves and hexamer moves compete instead of alternating.
#
# Run this against the two-phase script to see the difference discussed in the
# exercise answer: two phases usually win early, since the two kinds of move do
# not have to improve the structure simultaneously.
#
# Caveat: with a single mixed generator the selection decides which amplitudes
# actually apply, and for a shared symmetry only some selections reach it -- for
# PaaZ roughly half the time. The comparison is still indicative, but the
# single-phase run is handicapped beyond just having to move both at once.
# The two-phase script sidesteps this by selecting explicitly in each phase.

output output/paaz_step3_singlephase/
load {
	pdb Datafiles/SASDGL2.pdb
	saxs Datafiles/SASDGL2.dat
	split chain
}
convert_to_symmetry d3
split b1 518
autoconstrain backbone

save initial_state.pdb
save trajectory.xyz
parameter_generator {
	iterations 120
	translate 0.1
	rotate 0.1
	sym_translate 0.1
	sym_rotate 0.1
}

print "Initial chi2: {chi2_no_penalty}"
loop
	optimize_once
		on_improvement
			print {
				msg "{iteration}/{iterations_total}: Accepted with new chi2 {chi2_no_penalty}"
				colour green
			}
			update structure
			save trajectory.xyz
		end
	end
end
save final_state.pdb
